<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Solicitudes de Pago | Tesorería</title>

  <link rel="stylesheet" href="../../styles.css" />

  <style>
    body {
      margin: 0;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .page-header {
      background: white;
      padding: 18px 28px;
      border-bottom: 1px solid #ddd;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .page-main {
      max-width: 1400px;
      margin: 35px auto;
      padding: 0 24px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .form-grid label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .form-grid input,
    .form-grid select,
    textarea {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 13px 14px;
      border-bottom: 1px solid #eee;
      text-align: left;
      vertical-align: top;
    }

    th {
      background: #fafafa;
    }

    button {
      cursor: pointer;
      border: 0;
      padding: 10px 14px;
      border-radius: 6px;
    }

    .table-wrapper {
      overflow-x: auto;
    }

    .status-badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: #eee;
    }

    .summary-button {
      background: #f0f0f0;
      margin-right: 6px;
    }

    .open-request-button {
      background: #222;
      color: white;
    }

    .summary-row {
      display: none;
      background: #fafafa;
    }

    .summary-box {
      padding: 18px 8px;
    }

    .summary-table {
      margin-top: 12px;
      background: white;
      border: 1px solid #eee;
      border-radius: 8px;
      overflow: hidden;
    }

    .summary-table th,
    .summary-table td {
      padding: 10px 12px;
      font-size: 13px;
    }

    .totals-box {
      margin-top: 14px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .total-chip {
      padding: 8px 12px;
      border-radius: 8px;
      background: white;
      border: 1px solid #ddd;
      font-weight: 700;
    }

    .muted {
      color: #777;
    }

    .loading-inline {
      padding: 12px 0;
      color: #666;
    }

    @media (max-width: 700px) {
      .form-grid {
        grid-template-columns: 1fr;
      }

      .toolbar {
        flex-direction: column;
        align-items: flex-start;
        gap: 15px;
      }

      .page-header {
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

  <header class="page-header">
    <div>
      <a href="../index.html">
        ← Panel Administrativo
      </a>

      <strong style="margin-left: 20px;">
        CI Inti Mining · Tesorería
      </strong>
    </div>

    <button id="logoutButton">
      Cerrar sesión
    </button>
  </header>

  <main class="page-main">

    <div class="toolbar">

      <div>
        <h1>Solicitudes de Pago</h1>

        <p>
          Preparación, revisión y aprobación de pagos.
        </p>
      </div>

      <button id="newRequestButton">
        + Nueva Solicitud
      </button>

    </div>

    <div
      id="requestFormContainer"
      class="card"
      style="display: none;"
    >

      <h2>Nueva Solicitud</h2>

      <form id="requestForm">

        <div class="form-grid">

          <div>
            <label>Fecha de solicitud *</label>

            <input
              type="date"
              id="fechaSolicitud"
              required
            />
          </div>

          <div>
            <label>Tipo de solicitud *</label>

            <select
              id="tipoSolicitud"
              required
            >

              <option value="">
                Seleccionar tipo
              </option>

              <option value="FIJOS">
                Pagos Fijos
              </option>

              <option value="EXTRAORDINARIOS">
                Pagos Extraordinarios
              </option>

            </select>
          </div>

          <div
            id="quincenaContainer"
            style="display: none;"
          >

            <label>Quincena *</label>

            <select id="quincena">

              <option value="">
                Seleccionar quincena
              </option>

              <option value="Q1">
                Q1 - Primera quincena
              </option>

              <option value="Q2">
                Q2 - Segunda quincena
              </option>

            </select>

          </div>

        </div>

        <div style="margin-top: 18px;">

          <label>Observaciones</label>

          <textarea
            id="observaciones"
            rows="3"
          ></textarea>

        </div>

        <div style="margin-top: 20px;">

          <button type="submit">
            Crear Solicitud
          </button>

          <button
            type="button"
            id="cancelRequestButton"
          >
            Cancelar
          </button>

        </div>

        <div
          id="formMessage"
          style="
            display: none;
            margin-top: 15px;
          "
        ></div>

      </form>

    </div>

    <div class="card">

      <div id="loadingState">
        Cargando solicitudes...
      </div>

      <div
        id="errorState"
        style="display: none;"
      ></div>

      <div
        id="emptyState"
        style="display: none;"
      >
        No hay solicitudes registradas.
      </div>

      <div
        id="tableWrapper"
        class="table-wrapper"
        style="display: none;"
      >

        <table>

          <thead>

            <tr>
              <th>Código</th>
              <th>Fecha</th>
              <th>Tipo</th>
              <th>Quincena</th>
              <th>Estado</th>
              <th>Resumen</th>
              <th>Acciones</th>
            </tr>

          </thead>

          <tbody id="requestsTableBody"></tbody>

        </table>

      </div>

    </div>

  </main>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>

  <script
    src="../../js/supabase-config.js"
  ></script>

  <script
    src="../../js/auth.js"
  ></script>

  <script>

    const requestFormContainer =
      document.getElementById(
        "requestFormContainer"
      );

    const requestForm =
      document.getElementById(
        "requestForm"
      );

    const formMessage =
      document.getElementById(
        "formMessage"
      );

    const requestsTableBody =
      document.getElementById(
        "requestsTableBody"
      );

    const tipoSolicitud =
      document.getElementById(
        "tipoSolicitud"
      );

    const quincenaContainer =
      document.getElementById(
        "quincenaContainer"
      );

    const quincenaSelect =
      document.getElementById(
        "quincena"
      );

    const resumenCache = {};


    function actualizarQuincena() {

      if (
        tipoSolicitud.value === "FIJOS"
      ) {

        quincenaContainer.style.display =
          "block";

        quincenaSelect.required = true;

      } else {

        quincenaContainer.style.display =
          "none";

        quincenaSelect.required = false;

        quincenaSelect.value = "";

      }

    }


    tipoSolicitud.addEventListener(
      "change",
      actualizarQuincena
    );


    function formatearMoneda(
      valor,
      moneda
    ) {

      const numero =
        Number(valor || 0);

      try {

        return new Intl.NumberFormat(
          "es-CO",
          {
            minimumFractionDigits: 2,
            maximumFractionDigits: 2
          }
        ).format(numero) +
          " " +
          moneda;

      } catch {

        return numero.toFixed(2) +
          " " +
          moneda;

      }

    }


    function obtenerEstadoBadge(
      estado
    ) {

      return `
        <span class="status-badge">
          ${estado || ""}
        </span>
      `;

    }


    async function cargarResumenSolicitud(
      solicitudId,
      container
    ) {

      if (
        resumenCache[solicitudId]
      ) {

        renderizarResumen(
          resumenCache[solicitudId],
          container
        );

        return;

      }


      container.innerHTML = `
        <div class="loading-inline">
          Cargando detalle...
        </div>
      `;


      const { data, error } =
        await supabaseClient
          .from(
            "solicitud_pago_items"
          )
          .select(`
            id,
            orden,
            concepto,
            moneda,
            valor,
            estado,
            empresa_id,
            beneficiario_id,
            empresas (
              id,
              nombre_corto
            ),
            beneficiarios (
              id,
              nombre
            )
          `)
          .eq(
            "solicitud_id",
            solicitudId
          )
          .neq(
            "estado",
            "ELIMINADO"
          )
          .order(
            "orden",
            {
              ascending: true
            }
          );


      if (error) {

        container.innerHTML = `
          <div style="color:#b00020;">
            Error cargando detalle:
            ${error.message}
          </div>
        `;

        return;

      }


      resumenCache[solicitudId] =
        data || [];


      renderizarResumen(
        data || [],
        container
      );

    }


    function renderizarResumen(
      items,
      container
    ) {

      if (
        !items ||
        items.length === 0
      ) {

        container.innerHTML = `
          <div class="muted">
            Esta solicitud no tiene pagos activos.
          </div>
        `;

        return;

      }


      const totales = {};


      items.forEach(
        (item) => {

          const moneda =
            item.moneda || "—";

          if (!totales[moneda]) {
            totales[moneda] = 0;
          }

          totales[moneda] +=
            Number(item.valor || 0);

        }
      );


      const filas =
        items
          .map(
            (item) => {

              const beneficiario =
                item.beneficiarios
                  ?.nombre ||
                "—";

              const empresa =
                item.empresas
                  ?.nombre_corto ||
                "—";

              return `
                <tr>
                  <td>
                    ${empresa}
                  </td>

                  <td>
                    <strong>
                      ${beneficiario}
                    </strong>
                  </td>

                  <td>
                    ${item.concepto || "—"}
                  </td>

                  <td>
                    ${item.moneda || "—"}
                  </td>

                  <td>
                    ${formatearMoneda(
                      item.valor,
                      item.moneda
                    )}
                  </td>

                  <td>
                    ${obtenerEstadoBadge(
                      item.estado
                    )}
                  </td>
                </tr>
              `;

            }
          )
          .join("");


      const totalesHtml =
        Object
          .entries(totales)
          .map(
            ([moneda, valor]) => `
              <div class="total-chip">
                ${moneda}:
                ${formatearMoneda(
                  valor,
                  moneda
                )}
              </div>
            `
          )
          .join("");


      container.innerHTML = `

        <div class="summary-box">

          <strong>
            Pagos incluidos
          </strong>

          <div class="summary-table table-wrapper">

            <table>

              <thead>
                <tr>
                  <th>Empresa</th>
                  <th>Beneficiario</th>
                  <th>Concepto</th>
                  <th>Moneda</th>
                  <th>Valor</th>
                  <th>Estado</th>
                </tr>
              </thead>

              <tbody>
                ${filas}
              </tbody>

            </table>

          </div>

          <div class="totals-box">
            ${totalesHtml}
          </div>

        </div>

      `;

    }


    async function alternarResumen(
      solicitudId,
      rowId
    ) {

      const row =
        document.getElementById(
          rowId
        );


      if (!row) {
        return;
      }


      const abierto =
        row.style.display ===
        "table-row";


      if (abierto) {

        row.style.display =
          "none";

        return;

      }


      row.style.display =
        "table-row";


      const container =
        row.querySelector(
          ".summary-content"
        );


      await cargarResumenSolicitud(
        solicitudId,
        container
      );

    }


    async function cargarSolicitudes() {

      try {

        const authorizedUser =
          await getAuthorizedUser();


        if (!authorizedUser) {

          window.location.href =
            "../../login.html";

          return;

        }


        const { data, error } =
          await supabaseClient
            .from(
              "solicitudes_pago"
            )
            .select(`
              id,
              numero,
              codigo_visible,
              fecha_solicitud,
              quincena,
              tipo_solicitud,
              estado
            `)
            .order(
              "fecha_solicitud",
              {
                ascending: false
              }
            )
            .order(
              "numero",
              {
                ascending: false
              }
            );


        if (error) {
          throw error;
        }


        document
          .getElementById(
            "loadingState"
          )
          .style.display =
          "none";


        document
          .getElementById(
            "emptyState"
          )
          .style.display =
          "none";


        document
          .getElementById(
            "tableWrapper"
          )
          .style.display =
          "none";


        if (
          !data ||
          data.length === 0
        ) {

          document
            .getElementById(
              "emptyState"
            )
            .style.display =
            "block";

          return;

        }


        requestsTableBody.innerHTML =
          "";


        data.forEach(
          (solicitud) => {

            const row =
              document.createElement(
                "tr"
              );


            const summaryRowId =
              `summary-${solicitud.id}`;


            row.innerHTML = `

              <td>
                ${
                  solicitud.codigo_visible ||
                  `#${solicitud.numero || ""}`
                }
              </td>

              <td>
                ${
                  solicitud.fecha_solicitud ||
                  ""
                }
              </td>

              <td>
                ${
                  solicitud.tipo_solicitud ===
                  "FIJOS"
                    ? "Pagos Fijos"
                    : "Pagos Extraordinarios"
                }
              </td>

              <td>
                ${
                  solicitud.quincena ||
                  "—"
                }
              </td>

              <td>
                ${
                  obtenerEstadoBadge(
                    solicitud.estado
                  )
                }
              </td>

              <td>

                <button
                  class="summary-button"
                  data-id="${solicitud.id}"
                  data-row-id="${summaryRowId}"
                >
                  Ver pagos
                </button>

              </td>

              <td>

                <button
                  class="open-request-button"
                  data-id="${solicitud.id}"
                >
                  Abrir
                </button>

              </td>

            `;


            requestsTableBody
              .appendChild(row);


            const summaryRow =
              document.createElement(
                "tr"
              );


            summaryRow.id =
              summaryRowId;


            summaryRow.className =
              "summary-row";


            summaryRow.innerHTML = `
              <td colspan="7">
                <div class="summary-content"></div>
              </td>
            `;


            requestsTableBody
              .appendChild(
                summaryRow
              );

          }
        );


        document
          .getElementById(
            "tableWrapper"
          )
          .style.display =
          "block";


        document
          .querySelectorAll(
            ".open-request-button"
          )
          .forEach(
            (button) => {

              button.addEventListener(
                "click",
                () => {

                  window.location.href =
                    `solicitud-detalle.html?id=${button.dataset.id}`;

                }
              );

            }
          );


        document
          .querySelectorAll(
            ".summary-button"
          )
          .forEach(
            (button) => {

              button.addEventListener(
                "click",
                async () => {

                  await alternarResumen(
                    button.dataset.id,
                    button.dataset.rowId
                  );

                }
              );

            }
          );


      } catch (error) {

        console.error(
          "Error cargando solicitudes:",
          error
        );


        document
          .getElementById(
            "loadingState"
          )
          .style.display =
          "none";


        const errorState =
          document.getElementById(
            "errorState"
          );


        errorState.textContent =
          "Error: " +
          (
            error.message ||
            error
          );


        errorState.style.display =
          "block";

      }

    }


    document
      .getElementById(
        "newRequestButton"
      )
      .addEventListener(
        "click",
        () => {

          requestForm.reset();

          actualizarQuincena();


          document
            .getElementById(
              "fechaSolicitud"
            )
            .value =
            new Date()
              .toISOString()
              .split("T")[0];


          requestFormContainer
            .style.display =
            "block";


          requestFormContainer
            .scrollIntoView({
              behavior: "smooth"
            });

        }
      );


    document
      .getElementById(
        "cancelRequestButton"
      )
      .addEventListener(
        "click",
        () => {

          requestForm.reset();

          actualizarQuincena();


          requestFormContainer
            .style.display =
            "none";


          formMessage.style.display =
            "none";

        }
      );


    requestForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        formMessage.style.display =
          "none";


        try {

          const authorizedUser =
            await getAuthorizedUser();


          if (!authorizedUser) {

            window.location.href =
              "../../login.html";

            return;

          }


          const tipo =
            document
              .getElementById(
                "tipoSolicitud"
              )
              .value;


          const quincena =
            document
              .getElementById(
                "quincena"
              )
              .value;


          if (
            tipo === "FIJOS" &&
            !quincena
          ) {

            throw new Error(
              "Las solicitudes de pagos fijos deben tener una quincena."
            );

          }


          if (
            tipo ===
              "EXTRAORDINARIOS" &&
            quincena
          ) {

            throw new Error(
              "Las solicitudes extraordinarias no pueden tener quincena."
            );

          }


          const nuevaSolicitud = {

            fecha_solicitud:
              document
                .getElementById(
                  "fechaSolicitud"
                )
                .value,

            quincena:
              tipo === "FIJOS"
                ? quincena
                : null,

            tipo_solicitud:
              tipo,

            observaciones:
              document
                .getElementById(
                  "observaciones"
                )
                .value
                .trim() ||
              null,

            estado:
              "BORRADOR",

            created_by:
              authorizedUser.user_id,

            updated_by:
              authorizedUser.user_id

          };


          const { data, error } =
            await supabaseClient
              .from(
                "solicitudes_pago"
              )
              .insert(
                nuevaSolicitud
              )
              .select()
              .single();


          if (error) {
            throw error;
          }


          formMessage.textContent =
            "Solicitud creada correctamente.";


          formMessage.style.display =
            "block";


          requestForm.reset();

          actualizarQuincena();


          requestFormContainer
            .style.display =
            "none";


          await cargarSolicitudes();


        } catch (error) {

          console.error(
            "Error creando solicitud:",
            error
          );


          formMessage.textContent =
            "Error: " +
            (
              error.message ||
              error
            );


          formMessage.style.display =
            "block";

        }

      }
    );


    document
      .getElementById(
        "logoutButton"
      )
      .addEventListener(
        "click",
        logout
      );


    cargarSolicitudes();

  </script>

</body>
</html>
