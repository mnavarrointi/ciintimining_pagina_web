<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Préstamos | Inti Mining</title><link rel="stylesheet" href="../../styles.css"><style>body{font-family:Arial,sans-serif;background:#f5f6f8;color:#222;margin:0}main{max-width:1100px;margin:28px auto;padding:0 18px}.card{background:#fff;border:1px solid #ddd;border-radius:12px;padding:22px;margin:16px 0}input,select,button{padding:10px;border-radius:6px;border:1px solid #ccc}button{background:#222;color:white;cursor:pointer}button:disabled{opacity:.5}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}label{display:grid;gap:5px;font-size:13px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px;border-bottom:1px solid #eee}small{color:#666}.error{color:#a22}a{color:#333}</style></head><body><main><p><a href="../index.html">← Panel administrativo</a></p><h1>Préstamos frente a terceros</h1><p>Registro simplificado de préstamos por cobrar y por pagar. Los nuevos préstamos y sus devoluciones se originarán en conciliaciones bancarias confirmadas.</p><div id="status">Verificando acceso…</div><section id="app" hidden><div class="card"><h2>Préstamos registrados</h2><div id="list">Cargando…</div></div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../../js/supabase-config.js"></script><script src="../../js/auth.js"></script><script>
(async function(){
const status=document.getElementById('status'),app=document.getElementById('app');let loans=[];
try{
 const {data:{user},error:authError}=await supabaseClient.auth.getUser();if(authError||!user)throw Error('Inicia sesión desde el panel.');
 const {data:profile,error:profileError}=await supabaseClient.from('usuarios_app').select('rol,activo').eq('user_id',user.id).single();
 if(profileError||!profile?.activo||!['admin','consulta'].includes(profile.rol))throw Error('Acceso no autorizado.');
 app.hidden=false;status.textContent='';
 async function load(){
 const [a,b]=await Promise.all([supabaseClient.from('prestamos_grupo').select('*').order('created_at',{ascending:false}),supabaseClient.from('prestamos_aplicaciones').select('prestamo_id,valor_capital,fecha,moneda_pago,valor_pagado,nota').order('fecha',{ascending:false})]);
 if(a.error)throw a.error;if(b.error)throw b.error;
 loans=a.data.map(p=>({...p,aplicaciones:b.data.filter(x=>x.prestamo_id===p.id)}));
 const list=document.getElementById('list');list.replaceChildren();
 if(!loans.length){list.textContent='No hay préstamos registrados. Puedes crear el primero después de verificar la operación.';return;}
 const table=document.createElement('table'),head=document.createElement('tr');for(const h of ['Beneficiario','Tipo','Monto original','Fecha','Moneda','Saldo pendiente']){const th=document.createElement('th');th.textContent=h;head.append(th);}table.append(head);
 for(const p of loans){const saldo=p.capital_inicial-p.aplicaciones.reduce((s,a)=>s+Number(a.valor_capital),0),tr=document.createElement('tr');for(const value of [p.tercero,p.tipo==='POR_PAGAR'?'Por pagar':'Por cobrar',Number(p.capital_inicial).toLocaleString('es-CO'),p.fecha_inicio,p.moneda,saldo.toLocaleString('es-CO')]){const td=document.createElement('td');td.textContent=value;tr.append(td);}table.append(tr);}
 list.append(table);
 }
 await load();
}catch(err){status.textContent=err.message;status.className='error';}
})();
</script></body></html>
