<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Balance General | CI Inti Mining
  </title>

  <link
    rel="stylesheet"
    href="../../styles.css"
  >

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f4f5f7;
      font-family: Arial, sans-serif;
      color: #202124;
    }

    header {
      background: white;
      border-bottom: 1px solid #ddd;
      padding: 16px 26px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    main {
      max-width: 1550px;
      margin: 28px auto;
      padding: 0 22px 60px;
    }

    button {
      border: 0;
      border-radius: 7px;
      padding: 10px 14px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    select,
    input {
      padding: 9px 10px;
      border: 1px solid #ccc;
      border-radius: 7px;
      background: white;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .toolbar h1 {
      margin: 0 0 6px;
    }

    .muted {
      color: #666;
    }

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: end;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .primary {
      background: #222;
      color: white;
    }

    .secondary {
      background: #eee;
      color: #222;
    }

    /* =========================
       ESTADO DEL BALANCE
       ========================= */

    .balance-review-card {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .balance-review-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-wrap: wrap;
    }

    .balance-review-title {
      font-size: 13px;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .balance-state-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px 14px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 13px;
    }

    .balance-state-ready {
      background: #e8f7ec;
      color: #176b2c;
      border: 1px solid #c8e8cf;
    }

    .balance-state-pending {
      background: #fff4d6;
      color: #8a6200;
      border: 1px solid #ead79b;
    }

    .balance-review-info {
      font-size: 12px;
      color: #666;
      margin-top: 6px;
    }

    .ready-button {
      background: #176b2c;
      color: white;
    }

    .reopen-button {
      background: #f0f0f0;
      color: #333;
      border: 1px solid #ddd;
    }

    /* =========================
       RESUMEN
       ========================= */

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .summary-label {
      font-size: 12px;
      color: #666;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .4px;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 700;
      margin-top: 8px;
    }

    .summary-detail {
      margin-top: 6px;
      font-size: 12px;
      color: #777;
    }

    /* =========================
       ESTADO ACTUALIZACION
       ========================= */

    .status-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0,1fr));
      gap: 12px;
    }

    .status-item {
      border: 1px solid #e1e1e1;
      border-radius: 8px;
      padding: 13px;
    }

    .status-title {
      font-weight: 700;
      margin-bottom: 5px;
    }

    .status-ok {
      color: #176b2c;
    }

    .status-warning {
      color: #986b00;
    }

    /* =========================
       BALANCE
       ========================= */

    .side-title {
      padding: 15px 18px;
      border-radius: 10px;
      margin-bottom: 12px;
      font-size: 19px;
      font-weight: 700;
      background: #222;
      color: white;
    }

    .category {
      background: white;
      border-radius: 11px;
      margin-bottom: 13px;
      overflow: hidden;
      box-shadow: 0 3px 15px rgba(0,0,0,0.04);
    }

    .category-header {
      padding: 15px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      background: #fafafa;
      border-bottom: 1px solid #eee;
    }

    .category-header:hover {
      background: #f4f4f4;
    }

    .category-name {
      font-weight: 700;
    }

    .category-total {
      font-weight: 700;
      font-size: 16px;
    }

    .category-body {
      display: block;
    }

    .category.closed .category-body {
      display: none;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 950px;
    }

    th,
    td {
      padding: 10px 12px;
      border-bottom: 1px solid #eee;
      font-size: 12px;
    }

    th {
      background: #f6f6f6;
      text-align: left;
      color: #555;
    }

    td.number,
    th.number {
      text-align: right;
    }

    .position-name {
      font-weight: 600;
    }

    .position-sub {
      display: block;
      margin-top: 3px;
      color: #777;
      font-size: 10px;
    }

    .source {
      display: inline-block;
      padding: 4px 7px;
      border-radius: 5px;
      font-size: 10px;
      font-weight: 700;
    }

    .source-bank {
      background: #eaf3ff;
      color: #19568c;
    }

    .source-manual {
      background: #fff2d2;
      color: #876000;
    }

    .source-calculated {
      background: #e8f7ec;
      color: #176b2c;
    }

    .outdated {
      color: #9a6500;
      font-weight: 600;
    }

    .edit-button {
      background: #eee;
      padding: 7px 10px;
      font-size: 11px;
    }

    .group-row td {
      background: #fafafa;
      font-weight: 700;
    }

    .child-position {
      padding-left: 24px;
    }


    /* =========================
       VARIACION DIARIA
       ========================= */

    .variation-card {
      background: white;
      border-radius: 12px;
      padding: 22px;
      margin-bottom: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .variation-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 16px;
    }

    .variation-title {
      font-size: 18px;
      font-weight: 700;
    }

    .variation-value {
      font-size: 28px;
      font-weight: 700;
      text-align: right;
    }

    .variation-positive { color: #176b2c; }
    .variation-negative { color: #a32020; }
    .variation-neutral { color: #555; }

    .reconciliation-ok {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #e8f7ec;
      color: #176b2c;
      font-size: 12px;
      font-weight: 700;
    }

    .reconciliation-warning {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff1f1;
      color: #a32020;
      font-size: 12px;
      font-weight: 700;
    }

    .variation-table {
      min-width: 1250px;
    }

    .variation-table tr.detail-row {
      cursor: pointer;
    }

    .variation-table tr.detail-row:hover td {
      background: #fafafa;
    }

    .falcon-detail {
      margin-top: 12px;
      border: 1px solid #e1e1e1;
      border-radius: 10px;
      padding: 16px;
      background: #fafafa;
    }

    .falcon-grid {
      display: grid;
      grid-template-columns: repeat(4,minmax(0,1fr));
      gap: 12px;
      margin-top: 12px;
    }

    .falcon-metric {
      background: white;
      border: 1px solid #e7e7e7;
      border-radius: 8px;
      padding: 12px;
    }

    .falcon-metric-label {
      font-size: 10px;
      font-weight: 700;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 6px;
    }

    .falcon-metric-value {
      font-size: 15px;
      font-weight: 700;
    }

    /* =========================
       MODAL
       ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.45);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }

    .modal {
      background: white;
      width: min(540px,100%);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }

    .modal h2 {
      margin-top: 0;
    }

    .modal-field {
      margin-bottom: 15px;
    }

    .modal-field input {
      width: 100%;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      margin-top: 20px;
    }

    .message {
      margin-top: 13px;
      padding: 11px;
      border-radius: 7px;
      display: none;
    }

    .message.error {
      display: block;
      background: #ffeaea;
    }

    .message.success {
      display: block;
      background: #eaf7ed;
    }

    @media(max-width: 900px) {

      .summary-grid,
      .status-grid {
        grid-template-columns: 1fr;
      }

    }

  </style>

</head>


<body>


<header>

  <div>

    <a href="../index.html">
      ← Panel
    </a>

    <strong style="margin-left:18px;">
      CI Inti Mining · Finanzas
    </strong>

  </div>

  <button id="logoutButton">
    Cerrar sesión
  </button>

</header>


<main>


  <div class="card">

    <div class="toolbar">

      <div>

        <h1>
          Balance General
        </h1>

        <div class="muted">
          Estado diario de Activos,
          Pasivos y Patrimonio
        </div>

      <div class="filters">

            Fecha

    Cargando variación diaria...
  </div>

  <div

  ></div>


  <div id="balanceContent">

    </div>

</main>

<script
  src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
></script>

<script
  src="../../js/supabase-config.js"
></script>

<script
  src="../../js/auth.js"
></script>


<script>

  let balanceRows = [];

  let positionsMetadata =
    new Map();

  let rates = {};

  let selectedPosition =
    null;

  let currentUser =
    null;


  let variationRows = [];

  let falconDetail = null;

  let falconExpanded = false;

  let balanceReviewStatus =
    {
      estado:"PENDIENTE",
      comentario:null,
      aprobado_at:null
    };


  const $ =
    id =>
      document.getElementById(id);


  function escapeHtml(value) {

    return String(value ?? "")
      .replace(
        /[&<>"']/g,
        c =>
          ({
            "&":"&amp;",
            "<":"&lt;",
            ">":"&gt;",
            '"':"&quot;",
            "'":"&#039;"
          })[c]
      );

  }


  function formatNumber(value) {

    return (
      new Intl.NumberFormat(
        "es-CO",
        {
          minimumFractionDigits:2,
          maximumFractionDigits:2
        }
      )
      .format(
        Number(value || 0)
      )
    );

  }


  function formatMoney(
    value,
    currency
  ) {

    const symbols = {
      USD:"US$",
      COP:"$",
      PEN:"S/"
    };


    return (
      `${
        symbols[currency] ||
        currency
      } ${
        formatNumber(value)
      }`
    );

  }


  function formatDate(value) {

    if(!value) {
      return "—";
    }


    const [
      y,
      m,
      d
    ] =
      value.split("-");


    return `${d}/${m}/${y}`;

  }


  function formatDateTime(value) {

    if(!value) {
      return "";
    }


    try {

      return new Intl.DateTimeFormat(
        "es-CO",
        {
          dateStyle:"medium",
          timeStyle:"short"
        }
      ).format(
        new Date(value)
      );

    }

    catch {

      return value;

    }

  }


  function rateToUsd(currency) {

    if(currency === "USD") {
      return 1;
    }


    return Number(
      rates[currency]?.rate ||
      0
    );

  }


  function usdToDisplay(usdValue) {

    const currency =
      $("displayCurrency")
        .value;


    if(currency === "USD") {

      return Number(
        usdValue || 0
      );

    }


    const rate =
      rateToUsd(currency);


    return (
      Number(
        usdValue || 0
      )
      *
      rate
    );

  }


  function sourceChip(source) {

    if(source === "BANCO") {

      return `
        <span class="
          source
          source-bank
        ">
          AUTOMÁTICO
        </span>
      `;

    }


    if(source === "CALCULADA") {

      return `
        <span class="
          source
          source-calculated
        ">
          CALCULADO
        </span>
      `;

    }


    return `
      <span class="
        source
        source-manual
      ">
        MANUAL
      </span>
    `;

  }


  async function loadBalanceReviewStatus() {

    const date =
      $("balanceDate")
        .value;


    if(!date) {
      return;
    }


    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          "obtener_estado_balance_fecha",
          {
            p_fecha:date
          }
        );


    if(error) {

      console.error(
        "Error cargando estado del Balance:",
        error
      );

      throw error;

    }


    balanceReviewStatus =
      data || {
        fecha:date,
        estado:"PENDIENTE",
        comentario:null,
        aprobado_at:null
      };


    renderBalanceReviewStatus();

  }


  function renderBalanceReviewStatus() {

    const status =
      balanceReviewStatus?.estado ||
      "PENDIENTE";


    const isReady =
      status === "LISTO";


    const isAdmin =
      currentUser &&
      currentUser.rol !== "consulta";


    let actionButton =
      "";


    if(isAdmin) {

      if(isReady) {

        actionButton = `
          <button
            id="changeBalanceStatusButton"
            class="reopen-button"
          >
            Reabrir balance
          </button>
        `;

      }

      else {

        actionButton = `
          <button
            id="changeBalanceStatusButton"
            class="ready-button"
          >
            Marcar como LISTO
          </button>
        `;

      }

    }


    let details = "";


    if(isReady) {

      details = `
        Este Balance ya fue revisado
        manualmente y aprobado para
        esta fecha.
      `;


      if(
        balanceReviewStatus
          ?.aprobado_at
      ) {

        details += `
          Cierre registrado:
          ${
            escapeHtml(
              formatDateTime(
                balanceReviewStatus
                  .aprobado_at
              )
            )
          }.
        `;

      }

    }

    else {

      details = `
        El Balance todavía requiere
        revisión manual antes de
        considerarse terminado.
      `;

    }


    $("balanceReviewPanel")
      .innerHTML = `

        <div class="balance-review-card">

          <div>

            <div class="balance-review-left">

              <div class="balance-review-title">
                Estado del Balance
              </div>

              <div
                class="
                  balance-state-badge
                  ${
                    isReady
                    ?
                    "balance-state-ready"
                    :
                    "balance-state-pending"
                  }
                "
              >
                ${
                  isReady
                  ?
                  "✓ LISTO"
                  :
                  "● PENDIENTE"
                }
              </div>

              <div>
                ${
                  formatDate(
                    $("balanceDate")
                      .value
                  )
                }
              </div>

            </div>


            <div class="balance-review-info">

              ${details}

              ${
                balanceReviewStatus
                  ?.comentario
                ?
                `
                  <br>
                  <strong>
                    Comentario:
                  </strong>
                  ${
                    escapeHtml(
                      balanceReviewStatus
                        .comentario
                    )
                  }
                `
                :
                ""
              }

            </div>

          </div>


          <div>

            ${actionButton}

          </div>

        </div>

      `;


    const button =
      $("changeBalanceStatusButton");


    if(button) {

      button.onclick =
        toggleBalanceReviewStatus;

    }

  }


  async function toggleBalanceReviewStatus() {

    if(
      !currentUser ||
      currentUser.rol === "consulta"
    ) {
      return;
    }


    const date =
      $("balanceDate")
        .value;


    const currentStatus =
      balanceReviewStatus?.estado ||
      "PENDIENTE";


    const newStatus =
      currentStatus === "LISTO"
      ?
      "PENDIENTE"
      :
      "LISTO";


    let confirmationMessage;


    if(newStatus === "LISTO") {

      confirmationMessage =
        "¿Confirmas que el Balance de esta fecha fue revisado completamente?\n\n" +
        "Al marcarlo como LISTO estás indicando que todos los rubros fueron revisados manualmente y el Balance se considera terminado.";

    }

    else {

      confirmationMessage =
        "¿Confirmas que deseas reabrir este Balance?\n\n" +
        "La fecha volverá a estado PENDIENTE para permitir nuevas revisiones.";

    }


    if(
      !confirm(
        confirmationMessage
      )
    ) {
      return;
    }


    let comment = null;


    if(newStatus === "PENDIENTE") {

      const response =
        prompt(
          "Motivo de la reapertura:",
          "Corrección pendiente"
        );


      if(response === null) {
        return;
      }


      comment =
        response.trim() ||
        null;

    }


    const button =
      $("changeBalanceStatusButton");


    if(button) {

      button.disabled =
        true;

      button.textContent =
        newStatus === "LISTO"
        ?
        "Marcando..."
        :
        "Reabriendo...";

    }


    try {


      const {
        data,
        error
      } =
        await supabaseClient
          .rpc(
            "marcar_balance_fecha_estado",
            {

              p_fecha:
                date,

              p_estado:
                newStatus,

              p_comentario:
                comment

            }
          );


      if(error) {

        console.error(
          "Error cambiando estado del Balance:",
          error
        );

        throw error;

      }


      await loadBalanceReviewStatus();


    }

    catch(error) {


      alert(
        "No fue posible actualizar el estado del Balance: " +
        (
          error.message ||
          error
        )
      );


    }

  }


  async function loadRates(date) {

    const {
      data,
      error
    } =
      await supabaseClient
        .from(
          "tasas_cambio_diarias"
        )
        .select(
          "fecha,moneda,unidades_por_usd,fuente"
        )
        .lte(
          "fecha",
          date
        )
        .order(
          "fecha",
          {
            ascending:false
          }
        );


    if(error) {
      throw error;
    }


    rates = {

      USD:{
        rate:1,
        date,
        source:"USD"
      }

    };


    (data || [])
      .forEach(
        row => {

          if(!rates[row.moneda]) {

            rates[row.moneda] = {

              rate:
                Number(
                  row.unidades_por_usd
                ),

              date:
                row.fecha,

              source:
                row.fuente

            };

          }

        }
      );

  }


  async function loadMetadata() {

    const {
      data,
      error
    } =

  function variationClass(value) {

    const number =
      Number(value || 0);

    if(number > 0.005) {
      return "variation-positive";
    }

    if(number < -0.005) {
      return "variation-negative";
    }

    return "variation-neutral";

  }


  function signedMoney(
    value,
    currency = "USD"
  ) {

    const number =
      Number(value || 0);

    const sign =
      number > 0
      ?
      "+"
      :
      number < 0
      ?
      "−"
      :
      "";

    return (
      sign +
      formatMoney(
        Math.abs(number),
        currency
      )
    );

  }

  function renderVariation() {

    const panel =
      $("variationPanel");

    if(!panel) {
      return;
    }

    const date =
      $("balanceDate")
        .value;

    const currentTotals =
      calculateTotals();

    const rubricsImpact =
      variationRows.reduce(
        (total,row) =>
          total +
          Number(
            row.impacto_patrimonio_usd ||
            0
          ),
        0
      );

    const previousEquity =
      currentTotals.equity -
      rubricsImpact;

    const directVariation =
      currentTotals.equity -
      previousEquity;

    const difference =
      directVariation -
      rubricsImpact;

    const reconciled =
      Math.abs(difference) < 0.01;

    const previousDate =
      new Date(
        `${date}T12:00:00`
      );

    previousDate.setDate(
      previousDate.getDate() - 1
    );

    const previousDateText =
      previousDate
        .toISOString()
        .slice(0,10);

    const rows =
      variationRows
        .slice()
        .sort(
          (a,b) =>
            Math.abs(
              Number(
                b.impacto_patrimonio_usd ||
                0
              )
            )
            -
            Math.abs(
              Number(
                a.impacto_patrimonio_usd ||
                0
              )
            )
        )
        .map(
          row => {

            const isFalcon =
              row.codigo ===
              "ACT_CXC_PRESTAMO_FALCON";

            return `
              <tr
                class="${
                  isFalcon
                  ?
                  "detail-row"
                  :
                  ""
                }"
                ${
                  isFalcon
                  ?
                  'onclick="toggleFalconDetail()"'
                  :
                  ""
                }
              >

                <td>
                  <span class="position-name">
                    ${
                      escapeHtml(
                        row.nombre
                      )
                    }
                  </span>

                  ${
                    row.empresa
                    ?
                    `
                      <span class="position-sub">
                        ${
                          escapeHtml(
                            row.empresa
                          )
                        }
                      </span>
                    `
                    :
                    ""
                  }

                  ${
                    isFalcon
                    ?
                    `
                      <span class="position-sub">
                        ${
                          falconExpanded
                          ?
                          "▲ Ocultar detalle"
                          :
                          "▼ Ver amortización"
                        }
                      </span>
                    `
                    :
                    ""
                  }
                </td>

                <td>
                  ${
                    escapeHtml(
                      row.lado
                    )
                  }
                </td>

                <td>
                  ${
                    escapeHtml(
                      row.moneda
                    )
                  }
                </td>

                <td class="number">
                  ${
                    formatMoney(
                      row.valor_anterior,
                      row.moneda
                    )
                  }
                </td>

                <td class="number">
                  ${
                    formatMoney(
                      row.valor_actual,
                      row.moneda
                    )
                  }
                </td>

                <td class="number ${
                  variationClass(
                    row.cambio_moneda_original
                  )
                }">
                  ${
                    signedMoney(
                      row.cambio_moneda_original,
                      row.moneda
                    )
                  }
                </td>

                <td class="number ${
                  variationClass(
                    row.cambio_usd_movimiento
                  )
                }">
                  ${
                    signedMoney(
                      row.cambio_usd_movimiento,
                      "USD"
                    )
                  }
                </td>

                <td class="number ${
                  variationClass(
                    row.cambio_usd_tasa
                  )
                }">
                  ${
                    signedMoney(
                      row.cambio_usd_tasa,
                      "USD"
                    )
                  }
                </td>

                <td class="number ${
                  variationClass(
                    row.impacto_patrimonio_usd
                  )
                }">
                  <strong>
                    ${
                      signedMoney(
                        row.impacto_patrimonio_usd,
                        "USD"
                      )
                    }
                  </strong>
                </td>

              </tr>
            `;
          }
        )
        .join("");

    panel.innerHTML = `

      <div class="variation-header">

        <div>

          <div class="variation-title">
            Variación diaria del patrimonio
          </div>

          <div class="muted" style="margin-top:5px;">

              formatDate(
                previousDateText
              )
            }
            →
            ${
              formatDate(
                date
              )
            }
          </div>

        </div>

        <div>

          <div
            class="
              variation-value
              ${
                variationClass(
                  directVariation
                )
              }
            "
          >
            ${
              signedMoney(
                directVariation,
                "USD"
              )
            }
          </div>

          <div class="muted" style="text-align:right;margin-top:4px;">
            Patrimonio anterior:
            ${
              formatMoney(
                previousEquity,
                "USD"
              )
            }
          </div>

        </div>

      </div>

      <div class="${
        reconciled
        ?
        "reconciliation-ok"
        :
        "reconciliation-warning"
      }">
        ${
          reconciled
          ?
          `✓ Control de cuadre correcto. La suma de los impactos por rubro explica el 100% de la variación patrimonial.`

            No hay variaciones de rubros frente al día anterior.
          </div>
        `
      }

    `;

  }


  async function loadBalance() {

    const date =
      $("balanceDate")
        .value;


    if(!date) {
      return;
    }


    $("balanceContent")
      .innerHTML =
      `
        <div class="card">
          Calculando Balance...
        </div>
      `;


    $("balanceReviewPanel")
      .innerHTML =
      "Cargando estado del Balance...";


    await Promise.all([

      loadRates(date),

      loadMetadata(),

      loadBalanceReviewStatus(),

      loadDailyVariation(date)

    ]);


    const {
      data,
      error
    } =
      await supabaseClient
        .rpc(
          "obtener_balance_fecha",
          {
            p_fecha:date
          }
        );


    if(error) {
      throw error;
    }


    balanceRows =
      (data || [])
        .map(
          row => {

            const meta =
              positionsMetadata
                .get(
                  row.posicion_id
                );


            return {

              ...row,

              metadata:
                meta?.metadata ||
                {}

            };

          }
        );


    await loadFalconDetail(date);

    render();

  }


  function calculateTotals() {

    const assets =
      balanceRows
        .filter(
          row =>
            row.lado ===
            "ACTIVO"
        )
        .reduce(
          (total,row) =>
            total +
            Number(
              row.valor_usd ||
              0
            ),
          0
        );


    const liabilities =
      balanceRows
        .filter(
          row =>
            row.lado ===
            "PASIVO"
        )
        .reduce(
          (total,row) =>
            total +
            Number(
              row.valor_usd ||
              0
            ),
          0
        );


    return {

      assets,

      liabilities,

      equity:
        assets -
        liabilities

    };

  }

  function groupRows(rows) {

    const groups =
      new Map();


    rows.forEach(
      row => {

        const visualGroup =
          row.metadata
            ?.grupo_visual;


        const key =
          visualGroup ||
          row.posicion_id;


        if(!groups.has(key)) {

          groups.set(
            key,
            {
              name:
                visualGroup ||
                row.nombre,

              grouped:
                Boolean(
                  visualGroup
                ),

              rows:[]
            }
          );

        }


        groups
          .get(key)
          .rows
          .push(row);

      }
    );


    return Array.from(
      groups.values()
    );

  }

          total +
          Number(
            row.valor_usd ||

        0

    const groups =
      groupRows(rows);


    let tableRows = "";


    groups.forEach(
      group => {

        if(
          group.grouped &&
          group.rows.length > 1
        ) {

          const groupUsd =
            group.rows
              .reduce(
                (total,row) =>
                  total +
                  Number(
                    row.valor_usd ||

                0

          tableRows += `

                  escapeHtml(

                  group.rows.length

              <td class="number">

                    usdToDisplay(
                      groupUsd
                    ),
                    currency
                  )

          group.rows.forEach(
            row => {

            renderPositionRow(

  function renderSide(side) {

    const rows =
      balanceRows.filter(
        row =>
          row.lado ===
          side
      );


    const categoryMap =
      new Map();


    rows.forEach(
      row => {

        if(
          !categoryMap.has(
            row.categoria
          )
        ) {

          categoryMap.set(
            row.categoria,
            []
          );

        }


        categoryMap
          .get(
            row.categoria
          )
          .push(row);

      }
    );


    let html =
      `
        <div class="side-title">

          ${
            side ===
            "ACTIVO"
            ?
            "ACTIVOS"
            :
            "PASIVOS"
          }

        </div>
      `;


    categoryMap.forEach(
      (
        categoryRows,
        category
      ) => {

        html +=
          renderCategory(
            category,
            categoryRows
          );

      }
    );


    return html;

  }

    $("balanceContent")
      .innerHTML = `

        ${
          renderSide(
            "ACTIVO"
          )
        }

        ${
          renderSide(
            "PASIVO"
          )
        }

      `;

  }


  function openEdit(positionId) {

    if(
      !currentUser ||
      currentUser.rol === "consulta"
    ) {
      return;
    }


    const row =
      balanceRows.find(
        item =>
          item.posicion_id ===
          positionId
      );


    if(!row) {
      return;
    }


    selectedPosition =
      row;


    $("editPositionName")
      .textContent =
      row.nombre;


    $("editDate")
      .value =
      $("balanceDate")
        .value;


    $("editValue")
      .value =
      row.valor_original ??
      0;


    $("editValueLabel")
      .textContent =
      `Nuevo valor (${row.moneda})`;


    $("editComment")
      .value =
      "";


    $("editMessage")
      .className =
      "message";


    $("editMessage")
      .textContent =
      "";


    $("editModal")
      .style
      .display =
      "flex";

  }


  function closeEdit() {

    $("editModal")
      .style
      .display =
      "none";


    selectedPosition =
      null;

  }


  async function saveEdit() {

    if(
      !currentUser ||
      currentUser.rol === "consulta"
    ) {
      return;
    }


    if(!selectedPosition) {
      return;
    }


    const date =
      $("editDate")
        .value;


    const value =
      Number(
        $("editValue")
          .value
      );


    const comment =
      $("editComment")
        .value
        .trim();


    if(
      !date ||
      Number.isNaN(value) ||
      value < 0
    ) {

      $("editMessage")
        .className =
        "message error";


      $("editMessage")
        .textContent =
        "Revisa la fecha y el valor.";

      return;

    }


    $("saveEdit")
      .disabled =
      true;


    $("saveEdit")
      .textContent =
      "Guardando...";


    try {


      const {
        error
      } =
        await supabaseClient
          .from(
            "balance_valores"
          )
          .upsert(
            {

              posicion_id:
                selectedPosition
                  .posicion_id,

              fecha_efectiva:
                date,

              valor:
                value,

              comentario:
                comment ||
                null,

              fuente_referencia:
                "Actualización manual desde Balance General"

            },
            {

              onConflict:
                "posicion_id,fecha_efectiva"

            }
          );


      if(error) {
        throw error;
      }


      $("editMessage")
        .className =
        "message success";


      $("editMessage")
        .textContent =
        "Posición actualizada correctamente.";


      setTimeout(
        async () => {

          closeEdit();

          await loadBalance();

        },
        600
      );


    }

    catch(error) {


      console.error(error);


      $("editMessage")
        .className =
        "message error";


      $("editMessage")
        .textContent =
        error.message ||
        error;


    }

    finally {


      $("saveEdit")
        .disabled =
        false;


      $("saveEdit")
        .textContent =
        "Guardar";

    }

  }


  async function init() {

    const user =
      await getAuthorizedUser();


    if(!user) {

      location.href =
        "../../login.html";

      return;

    }


    currentUser =
      user;


    $("logoutButton")
      .onclick =
      logout;


    $("refreshButton")
      .onclick =
      loadBalance;


    $("displayCurrency")
      .onchange =
      render;


    $("balanceDate")
      .onchange =
      loadBalance;


    $("cancelEdit")
      .onclick =
      closeEdit;


    $("saveEdit")
      .onclick =
      saveEdit;


    $("editModal")
      .onclick =
      event => {

        if(
          event.target ===
          $("editModal")
        ) {

          closeEdit();

        }

      };


    await loadBalance();

  }


  init()
    .catch(
      error => {

        console.error(error);


        $("balanceContent")
          .innerHTML = `

            <div class="card">

              <strong>
                Error cargando Balance:
              </strong>

              ${
                escapeHtml(
                  error.message ||
                  error
                )
              }

            </div>

          `;

      }
    );

</script>


</body>

</html>
