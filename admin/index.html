<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Administrativo | CI Inti Mining</title>

  <link rel="stylesheet" href="../styles.css" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .admin-header {
      background: white;
      padding: 18px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #ddd;
    }

    .admin-main {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 24px;
    }

    .admin-card {
      background: white;
      padding: 28px;
      border-radius: 12px;
      margin-bottom: 20px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    .module-link {
      display: inline-block;
      margin-top: 15px;
      text-decoration: none;
      font-weight: 600;
    }

    .logout-button {
      cursor: pointer;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
    }

    #adminContent {
      display: none;
    }

    #loadingState {
      padding: 40px;
      text-align: center;
    }
  </style>
</head>

<body>

  <div id="loadingState">
    Verificando acceso...
  </div>

  <div id="adminContent">

    <header class="admin-header">
      <div>
        <strong>CI Inti Mining</strong>
        <div id="userInfo"></div>
      </div>

      <button id="logoutButton" class="logout-button">
        Cerrar sesión
      </button>
    </header>

    <main class="admin-main">

      <h1>Panel Administrativo</h1>

      <div class="admin-card">
        <h2>Tesorería</h2>

        <p>
          Gestión de pagos fijos y movimientos de tesorería.
        </p>

        <a
          href="tesoreria/pagos-fijos.html"
          class="module-link"
        >
          Ir a Tesorería →
        </a>
      </div>

    </main>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="../js/supabase-config.js"></script>
  <script src="../js/auth.js"></script>

  <script>
    async function initializeAdmin() {
      try {
        const authorizedUser = await getAuthorizedUser();

        if (!authorizedUser) {
          window.location.href = "../login.html";
          return;
        }

        document.getElementById("userInfo").textContent =
          `${authorizedUser.nombre || authorizedUser.email} · ${authorizedUser.rol}`;

        document.getElementById("loadingState").style.display = "none";
        document.getElementById("adminContent").style.display = "block";

      } catch (error) {
        console.error(error);
        window.location.href = "../login.html";
      }
    }

    document
      .getElementById("logoutButton")
      .addEventListener("click", logout);

    initializeAdmin();
  </script>

</body>
</html>
