<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Acceso Administrativo | CI Inti Mining</title>

  <link rel="stylesheet" href="styles.css" />

  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f5f5f5;
      font-family: Arial, sans-serif;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 40px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
    }

    .login-container h1 {
      margin-top: 0;
      margin-bottom: 8px;
    }

    .login-container p {
      margin-bottom: 28px;
      color: #666;
    }

    .login-field {
      margin-bottom: 18px;
    }

    .login-field label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
    }

    .login-field input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    .login-button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }

    .login-error {
      display: none;
      margin-top: 16px;
      color: #b00020;
    }

    .login-back {
      display: block;
      margin-top: 20px;
      text-align: center;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <main class="login-container">
    <h1>Acceso Administrativo</h1>

    <p>
      Ingresa tus credenciales para acceder al sistema interno de CI Inti Mining.
    </p>

    <form id="loginForm">

      <div class="login-field">
        <label for="email">Correo</label>

        <input
          type="email"
          id="email"
          autocomplete="email"
          required
        />
      </div>

      <div class="login-field">
        <label for="password">Contraseña</label>

        <input
          type="password"
          id="password"
          autocomplete="current-password"
          required
        />
      </div>

      <button type="submit" class="login-button">
        Ingresar
      </button>

      <div id="loginError" class="login-error">
        No fue posible iniciar sesión.
      </div>

    </form>

    <a href="index.html" class="login-back">
      Volver al sitio web
    </a>
  </main>


  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="js/supabase-config.js"></script>
  <script src="js/auth.js"></script>

  <script>
    const loginForm = document.getElementById("loginForm");
    const loginError = document.getElementById("loginError");

    loginForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      loginError.style.display = "none";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await login(email, password);

        const authorizedUser = await getAuthorizedUser();

        if (!authorizedUser) {
          await supabaseClient.auth.signOut();

          loginError.textContent =
            "Tu usuario no está autorizado para acceder al sistema.";

          loginError.style.display = "block";

          return;
        }

        window.location.href = "admin/index.html";

     } catch (error) {
        console.error("ERROR LOGIN:", error);

        loginError.textContent =
            "Error: " + (error.message || error);

        loginError.style.display = "block";
        }
    });
  </script>

</body>
</html>
